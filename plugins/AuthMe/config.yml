# ----------------------------------------------------------------------------
# AuthMeReloaded 完整配置文件 (安全加固版)
# 修改项已标注 [安全修改]
# ----------------------------------------------------------------------------

DataSource:
    backend: SQLITE
    caching: true
    useVirtualThreadsCache: false
    mySQLHost: 127.0.0.1
    mySQLPort: '3306'
    MariaDbSslMode: disabled
    mySQLUseSSL: true
    mySQLCheckServerCertificate: true
    mySQLAllowPublicKeyRetrieval: true
    mySQLUsername: authme
    mySQLPassword: '12345'
    mySQLDatabase: authme
    mySQLTablename: authme
    mySQLColumnId: id
    mySQLColumnName: username
    mySQLRealName: realname
    mySQLColumnPassword: password
    mySQLColumnSalt: ''
    mySQLColumnEmail: email
    mySQLColumnLogged: isLogged
    mySQLColumnHasSession: hasSession
    mySQLtotpKey: totp
    mySQLColumnIp: ip
    mySQLColumnLastLogin: lastlogin
    mySQLColumnRegisterDate: regdate
    mySQLColumnRegisterIp: regip
    mySQLlastlocX: x
    mySQLlastlocY: y
    mySQLlastlocZ: z
    mySQLlastlocWorld: world
    mySQLlastlocYaw: yaw
    mySQLlastlocPitch: pitch
    mySQLPlayerUUID: ''
    poolSize: 10
    maxLifetime: 1800

ExternalBoardOptions:
    mySQLColumnGroup: ''
    nonActivedUserGroup: -1
    mySQLOtherUsernameColumns: []
    bCryptLog2Round: 12
    phpbbTablePrefix: phpbb_
    phpbbActivatedGroupId: 2
    IPBTablePrefix: ipb_
    IPBActivatedGroupId: 3
    XFTablePrefix: xf_
    XFActivatedGroupId: 2
    wordpressTablePrefix: wp_

3rdPartyFeature:
    compatibility:
        menuPlugins: false
    features:
        i18nMessages:
            enabled: false
            locale-code-redirect: 
            - tt_ru:ru
            - lzh:zhcn
        bedrockAutoLogin: false
        purgeData:
            purgeOnQuit: false
            purgeWorldFolderName: world
    fixes:
        antiGhostPlayer: false
        advancedShulkerFix: false
        loginLocationFix:
            fixPortalStuck: false
            fixGroundStuck: false

settings:
    sessions:
        # [安全修改] 禁用会话，每次进服必须输入密码
        enabled: false
        # [安全修改] 会话超时置 0
        timeout: 0
    
    messagesLanguage: zhcn
    
    forceVaultHook: false
    logLevel: INFO
    useAsyncTasks: true
    serverName: Your Minecraft Server
    
    restrictions:
        # [安全修改] 禁止未登录玩家聊天
        allowChat: false
        hideChat: false
        allowCommands: 
        - /login
        - /log
        - /l
        - /register
        - /reg
        - /email
        - /captcha
        - /2fa
        - /totp
        
        maxRegPerIp: 3
        minNicknameLength: 3
        maxNicknameLength: 16
        ForceSingleSession: true
        ForceSpawnLocOnJoin:
            enabled: true
            worlds: 
            - world
            - world_nether
            - world_the_end
            - ASkyBlock
            - ASkyBlock_nether
        SaveQuitLocation: true
        AllowRestrictedUser: true
        AllowedRestrictedUser: 
        - server_land;127.0.0.1
        - server;127.0.0.1
        - admin;127.0.0.1
        - console;127.0.0.1
        - root;127.0.0.1
        banUnsafedIP: false
        kickNonRegistered: false
        kickOnWrongPassword: false
        teleportUnAuthedToSpawn: true
        
        # 允许未登录玩家在 0 半径内移动（即登录界面附近）
        allowMovement: true
        timeout: 360
        allowedNicknameCharacters: '[a-zA-Z0-9_]*'
        # 允许未登录玩家在 3 格半径内移动（避免登录提示不可见）
        allowedMovementRadius: 3
        # [安全修改] 登录前保护背包
        ProtectInventoryBeforeLogIn: true
        DenyTabCompleteBeforeLogin: false
        displayOtherAccounts: false
        spawnPriority: essentials,default
        maxLoginPerIp: 3
        maxJoinPerIp: 3
        noTeleport: false
        allowedPasswordCharacters: '[!-~]*'
        allowedEmailCharacters: ^([a-zA-Z0-9_.+-]+)@([a-zA-Z0-9-]+)\.([a-zA-Z]{2,})$

    GameMode:
        ForceSurvivalMode: false
    unrestrictions:
        UnrestrictedName: []
        UnrestrictedInventories: []
        StrictUnrestrictedInventoriesCheck: true

    security:
        minPasswordLength: 8
        passwordMaxLength: 26
        # 保持 SHA256 哈希（升级 BCRYPT 会让现有玩家无法登录）
        passwordHash: SHA256
        legacyHashes: []
        doubleMD5SaltLength: 8
        pbkdf2Rounds: 10000
        unsafePasswords: 
        - '12345678'
        - password
        - '123456789'

    registration:
        enabled: true
        messageInterval: 5
        force: true
        type: PASSWORD
        secondArg: CONFIRMATION
        email:
            unregisterOnEmailVerificationFailure: false
            unregisterAfterMinutes: 10
        forceKickAfterRegister: false
        forceLoginAfterRegister: false

    delayJoinMessage: true
    customJoinMessage: ''
    removeUnloggedLeaveMessage: true
    removeJoinMessage: true
    removeLeaveMessage: true
    applyBlindEffect: false
    preventOtherCase: true

GroupOptions:
    # 不启用 LuckPerms 组管理，避免不存在的组名导致异常
    enablePermissionCheck: false
    registeredPlayerGroup: ''
    unregisteredPlayerGroup: ''

Email:
    mailSMTP: smtp.163.com
    mailPort: 465
    useTls: true
    mailAccount: ''
    mailPassword: ''
    mailAddress: ''
    mailSenderName: ''
    RecoveryPasswordLength: 12
    mailSubject: Your new AuthMe password
    maxRegPerEmail: 1
    recallPlayers: false
    delayRecall: 5
    generateImage: false
    emailOauth2Token: ''
    shutDownEmail: false
    shutDownEmailAddress: your@mail.com

Hooks:
    multiverse: false
    placeholderapi: false
    bungeecord: false
    velocity: false
    proxySendDelay: 10
    floodgate: false
    ignoreBedrockNameCheck: true
    sendPlayerTo: ''
    disableSocialSpy: false
    useEssentialsMotd: false

Protection:
    enableProtection: false
    enableProtectionRegistered: false
    countries: 
    - LOCALHOST
    countriesBlacklist: 
    - A1
    enableAntiBot: true
    antiBotInterval: 5
    antiBotSensibility: 10
    antiBotDuration: 10
    antiBotDelay: 60
    quickCommands:
        denyCommandsBeforeMilliseconds: 1000

Purge:
    useAutoPurge: false
    daysBeforeRemovePlayer: 60
    removePlayerDat: false
    removeEssentialsFile: false
    defaultWorld: world
    removeLimitedCreativesInventories: false
    removeAntiXRayFile: false
    removePermissions: false

Security:
    SQLProblem:
        stopServer: false
    console:
        logConsole: true
    account:
        haveIBeenPwned:
            check: false
            limit: 0
        emailVerification:
            # [安全加固] 邮件功能未配置，关闭强制验证
            required: false
    captcha:
        useCaptcha: false
        maxLoginTry: 8
        captchaLength: 6
        captchaCountReset: 120
        requireForRegistration: false
    tempban:
        # [安全加固] 启用临时封禁防爆破
        enableTempban: true
        maxLoginTries: 8
        tempbanLength: 480
        minutesBeforeCounterReset: 480
        customCommand: ''
    recoveryCode:
        length: 8
        validForHours: 6
        maxTries: 4
        passwordChangeTimeout: 5
    emailRecovery:
        cooldown: 60
    privacy:
        enableEmailMasking: false
        verificationCodeExpiration: 10

Plugin:
    updates:
        checkForUpdates: false
    banners:
        showBanners: true

limbo:
    persistence:
        type: INDIVIDUAL_FILES
        distributionSize: SIXTEEN
    restoreAllowFlight: RESTORE
    restoreFlySpeed: RESTORE_NO_ZERO
    restoreWalkSpeed: RESTORE_NO_ZERO

BackupSystem:
    ActivateBackup: false
    OnServerStart: false
    OnServerStop: true
    MysqlWindowsPath: ''

Converter:
    CrazyLogin:
        fileName: accounts.db
    loginSecurity:
        useSqlite: true
        mySql:
            host: ''
            database: ''
            user: ''
            password: ''