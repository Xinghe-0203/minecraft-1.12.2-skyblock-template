# Forums: http://www.spigotmc.org/
# Bug tracker: http://www.spigotmc.org/go/bugs


settings:
  allow-end: true
  warn-on-overload: true
  permissions-file: permissions.yml
  update-folder: update
  plugin-profiling: false
  connection-throttle: 4000
  query-plugins: true
  deprecated-verbose: default
  shutdown-message: 服务器正在关闭，请稍后再试。
spawn-limits:
  monsters: 200
  animals: 10
  water-animals: 3
  ambient: 1
chunk-gc:
  period-in-ticks: 300
  load-threshold: 300
ticks-per:
  animal-spawns: 800
  monster-spawns: 1
  autosave: 6000
aliases: {}
worlds:
  world:
    environment: NORMAL
  ASkyBlock:
    environment: NORMAL
    type: FLAT
    generator: ASkyBlock
    mob-spawn-limits:
      monsters: 100
      animals: 20
      water-animals: 5
      ambient: 5
    ticks-per:
      monster-spawns: 1
      animal-spawns: 400
