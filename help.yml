# Bukkit 帮助系统配置文件
# 此文件可定义 /help 命令展示的额外主题与索引。
# 默认情况下所有插件命令会自动注册到帮助列表，无需修改本文件。
# 本文件仅在需要新增自定义帮助页时使用。

# 是否在主帮助索引中列出每个单独的命令帮助主题
command-topics-in-master-index: true

# --- 自定义帮助主题 ---
# 每个 general-topics 都会作为独立主题出现在 /help 索引中
general-topics:
    规则:
        shortText: 星空岛服务器规则
        fullText: |
            &61. 尊重其他玩家，禁止辱骂、骚扰与恶意挑衅。
            &62. 禁止作弊、使用外挂、恶意利用漏洞。
            &63. 主城内禁止破坏方块，野外领地受 WorldGuard 保护。
            &64. 禁止使用他人账号，使用本人账号对自己的行为负责。
            &65. 禁止刷金、刷物品、利用 Bug 牟利。
            &66. 遇到问题可在 Discord 或联系管理员处理。
        permission: topics.rules
    商店:
        shortText: 星空岛商店系统说明
        fullText: |
            &b--- 星空岛商店系统 ---
            &eNPC 商店 &f: 输入 &a/shop &f打开 BossShop 物资商店
            &e玩家商店 &f: 在箱子上使用 &a/qs create <价格> &f创建
            &e回收 &f: 手持物品输入 &a/sell &f出售，&a/sellall &f一键出售
            &e查询 &f: 输入 &a/worth <物品> &f查看回收价
        permission: topics.shop
    空岛:
        shortText: 星空岛空岛玩法说明
        fullText: |
            &b--- 星空岛空岛玩法 ---
            &e创建岛屿 &f: 首次进服使用 &a/is &f创建你的专属空岛
            &e邀请伙伴 &f: 输入 &a/is coop <玩家> &f邀请伙伴
            &e传送回家 &f: 输入 &a/is &f随时回到自己的岛
            &e重置岛屿 &f: 输入 &a/is reset &f重置（冷却 5 分钟）
            &e挑战系统 &f: 输入 &a/challenges &f查看可完成的挑战与奖励
        permission: topics.skyblock

# --- 帮助索引子项 ---
# 自定义的子索引会出现在 /help 索引中
index-topics:
    服务器指令:
        shortText: 星空岛常用指令速查
        preamble: '&e新玩家必看'
        permission: topics.basic
        commands:
            - /spawn
            - /kit newbie
            - /sethome
            - /home
            - /bal
            - /shop
            - /tpa
