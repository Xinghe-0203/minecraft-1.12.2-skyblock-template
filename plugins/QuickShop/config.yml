# QuickShop 经典版配置文件 - 星空岛专用 (最终修复版)
# 适用于 1.12.2，已修复所有启动错误并补全物品汉化

# 税收设置
tax: 0.00
tax-account: tax
show-tax: false

# 数据库
database:
  mysql: false
  host: localhost
  port: 3306
  database: quickshop
  user: root
  password: passwd

# 商店限制 (建议设为 false，除非你确实需要限制玩家开店数)
limits:
  use: false
  default: 10

# 允许作为商店的方块
shop-blocks:
- CHEST
- TRAPPED_CHEST

shop:
  # 创建费用
  cost: 10
  refund: true

  # 价格修改手续费
  price-change-requires-fee: true
  fee-for-price-change: 5

  # 安全设置
  lock: true
  sneak-to-create: false
  sneak-to-trade: false
  
  # 自动木牌 (经典版建议开启)
  auto-sign: true
  
  # 【重点】开启悬浮物品
  # 注意：在 1.12.2 如果开启后出现刷物品 Bug，请将此项设为 false
  display-items: false
  display-items-check-ticks: 100

  # 寻找商店距离
  find-distance: 45

# 物品汉化 (1.12.2 Bukkit原生底层ID无错版)
custom-items-name:
